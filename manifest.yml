id: classisland.sleepwatch
name: SleepWatch 课堂睡意监测
description: 按「连续静置时长」判断谁睡着了：静置进疑似、撑够才确认，主界面显示确认沉睡人数与抬头率。不认人、不联网、默认不存画面。纯娱乐向，数字仅供参考。
entranceAssembly: "ClassIsland.SleepWatch.dll"
url: https://github.com/ShirakawaFM/ClassIsland.SleepWatch
author: ShirakawaFM / 白川方明
version: 1.5.0.0
apiVersion: 2.1.0.1
supportedOSPlatforms:
  - Windows

# 以下字段用于上架插件市场（PluginIndex），本地加载插件时用不到
repoOwner: ShirakawaFM
repoName: ClassIsland.SleepWatch
assetsRoot: main/
# 不写 artifactName：每个版本的包名都带版本号（ClassIsland.SleepWatch_for_version_<版本>.cipx），
# 固定写一个名字就只能匹配到某一个版本。留空时索引生成器会取该 Release 里的第一个 .cipx，
# 每个 Release 只放一个包即可。
tagPattern: 1.*.*.*
