<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="SleepWatch · MIT © ShirakawaFM / 白川方明">
  <defs>
    <linearGradient id="fbg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05090F"/>
      <stop offset="0.5" stop-color="#08161F"/>
      <stop offset="1" stop-color="#04131A"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#3BE8C4"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BE8C4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2BE8C4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2BE8C4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DFFFF8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="150" fill="url(#fbg2)"/>
  <rect x="0" y="0" width="1280" height="1.5" fill="url(#hair)"/>

  <text x="64" y="86" fill="url(#sig)" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="46" font-style="italic">ShirakawaFM</text>
  <g opacity="0.8">
    <rect x="-120" y="50" width="120" height="46" fill="url(#shimmer)">
      <animate attributeName="x" values="-120;520" dur="5s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="64" y="116" fill="#5B7E96" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">白川方明 · 独立开发者 · 把复杂的东西做小</text>

  <path d="M64 98 C160 108 300 92 420 100" fill="none" stroke="#2BE8C4" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#3F6A82">
    <text x="64" y="140">MIT LICENSED · 2026</text>
    <text x="1216" y="140" text-anchor="end" fill="#3F8A7A">github.com/ShirakawaFM/ClassIsland.SleepWatch</text>
  </g>

  <g transform="translate(770 40)" fill="none" stroke="#2BE8C4" stroke-width="2" opacity="0.5">
    <path d="M0 34 h18 l10 -22 l14 44 l12 -30 l10 18 h22 l10 -26 l13 40 l11 -24 h20">
      <animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="1150" cy="62" r="3" fill="#2BE8C4">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
